<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" fill="none">
  <defs>
    <clipPath id="round"><rect width="1200" height="380" rx="28"/></clipPath>

    <radialGradient id="glowOrange" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#E26F27" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#E26F27" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="plateBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A212B"/>
      <stop offset="100%" stop-color="#11161E"/>
    </linearGradient>
    <linearGradient id="plateTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3A2317"/>
      <stop offset="55%" stop-color="#4A2C18"/>
      <stop offset="100%" stop-color="#2A1B12"/>
    </linearGradient>
    <linearGradient id="seam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E26F27" stop-opacity="0"/>
      <stop offset="22%" stop-color="#FF8C43" stop-opacity="1"/>
      <stop offset="78%" stop-color="#FF8C43" stop-opacity="1"/>
      <stop offset="100%" stop-color="#E26F27" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#30363D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3D4650" stop-opacity="1"/>
      <stop offset="100%" stop-color="#30363D" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#8B949E" fill-opacity="0.075"/>
    </pattern>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <g clip-path="url(#round)" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="1200" height="380" fill="#0B0F16"/>
    <rect width="1200" height="380" fill="url(#dots)"/>
    <ellipse cx="905" cy="205" rx="330" ry="235" fill="url(#glowOrange)"/>
    <ellipse cx="150" cy="30" rx="360" ry="230" fill="url(#glowBlue)"/>

    <!-- ============ left: wordmark and claim ============ -->
    <g transform="translate(72,0)">
      <!-- eyebrow -->
      <rect x="0" y="86" width="3" height="15" rx="1.5" fill="#E26F27"/>
      <text x="14" y="99" fill="#B9713F" font-size="12.5" font-weight="600" letter-spacing="2.6">DPA+ · OVERLAY</text>

      <text x="0" y="164" fill="#F0F6FC" font-size="50" font-weight="700" letter-spacing="-1.4">librechat-patches</text>

      <text x="0" y="205" fill="#9BA7B4" font-size="18.5" letter-spacing="-0.15">A thin overlay on the official image.</text>
      <text x="0" y="232" fill="#9BA7B4" font-size="18.5" letter-spacing="-0.15">It unlocks hardcoded values. It changes no defaults.</text>

      <!-- chips -->
      <g transform="translate(0,266)">
        <g>
          <rect x="0" y="0" width="150" height="32" rx="16" fill="#161B22" stroke="#30363D"/>
          <circle cx="19" cy="16" r="3.2" fill="#3FB950"/>
          <text x="32" y="21" fill="#C9D1D9" font-size="13" font-weight="500">defaults intact</text>
        </g>
        <g transform="translate(162,0)">
          <rect x="0" y="0" width="164" height="32" rx="16" fill="#161B22" stroke="#30363D"/>
          <circle cx="19" cy="16" r="3.2" fill="#58A6FF"/>
          <text x="32" y="21" fill="#C9D1D9" font-size="13" font-weight="500">upstream-tracked</text>
        </g>
        <g transform="translate(338,0)">
          <rect x="0" y="0" width="96" height="32" rx="16" fill="#161B22" stroke="#30363D"/>
          <circle cx="19" cy="16" r="3.2" fill="#E26F27"/>
          <text x="32" y="21" fill="#C9D1D9" font-size="13" font-weight="500">not a fork</text>
        </g>
      </g>
    </g>

    <!-- ============ right: the two-plate stack ============ -->
    <g transform="translate(742,96)">
      <!-- ambient shadow under the stack -->
      <ellipse cx="192" cy="212" rx="176" ry="16" fill="#000000" fill-opacity="0.55" filter="url(#soft)"/>

      <!-- result plate (what we publish) -->
      <g transform="translate(0,150)">
        <rect x="0" y="0" width="384" height="60" rx="14" fill="url(#plateBase)" stroke="#3A4450"/>
        <text x="22" y="25" fill="#6E7A87" font-size="10.5" font-weight="600" letter-spacing="1.8">RESULT</text>
        <text x="22" y="45" fill="#F0F6FC" font-size="14.5" font-weight="600">ghcr.io/dpa-plus/librechat-api</text>
        <circle cx="358" cy="30" r="4" fill="#3FB950"/>
      </g>

      <!-- the patch layer: thin, lit, the whole point of the repo -->
      <g transform="translate(28,96)">
        <rect x="0" y="0" width="328" height="38" rx="10" fill="url(#plateTop)" stroke="#E26F27" stroke-opacity="0.75"/>
        <rect x="0" y="0" width="328" height="38" rx="10" fill="none" stroke="#FF8C43" stroke-opacity="0.22" stroke-width="3" filter="url(#softer)"/>
        <text x="18" y="24" fill="#FFB07A" font-size="13.5" font-weight="600" letter-spacing="0.2">patches/001-image-resize</text>
        <!-- one file, one env var: the whole diff, stated quietly -->
        <text x="310" y="24" text-anchor="end" fill="#B9713F" font-size="11.5" font-weight="600" letter-spacing="0.6">1 FILE</text>
      </g>

      <!-- glowing seam: the patch meets the base -->
      <rect x="28" y="141" width="328" height="2" rx="1" fill="url(#seam)" filter="url(#softer)"/>

      <!-- base plate (upstream, deliberately muted) -->
      <g transform="translate(28,36)">
        <rect x="0" y="0" width="328" height="56" rx="12" fill="#12171F" stroke="#2A313B"/>
        <text x="18" y="23" fill="#5C6773" font-size="10.5" font-weight="600" letter-spacing="1.8">BASE</text>
        <text x="18" y="43" fill="#8B949E" font-size="14" font-weight="500">ghcr.io/danny-avila/librechat-api</text>
      </g>

      <!-- hairline above the base, suggesting the untouched upstream stack -->
      <rect x="52" y="18" width="280" height="1" fill="url(#hair)"/>
      <rect x="76" y="6" width="232" height="1" fill="url(#hair)" opacity="0.55"/>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="379" rx="28" fill="none" stroke="#232A33"/>
  </g>
</svg>
